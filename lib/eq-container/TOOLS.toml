# TOOLS.toml: the declarative allowlist of every tool that may exist in an eq-container image (X2/X3/X4 of the scope extensions).
# One entry per tool, one entry per image, one entry per profile. Nothing outside this file gets into a final image: the
# Dockerfiles copy exactly the tools an [[image]] lists, tc/fetch-tool.sh and minimal/mkrootfs.sh read their inputs from here,
# build.sh refuses to build while a selected entry is PLACEHOLDER (exit 13), verify-tools.sh re-checks the hashes and the
# in-image lock (/opt/eq/TOOLS.lock) before a run. The format is a TOML subset read by tools.sh (see its header): the first key of
# a table is `name`; values are one-line strings or one-line arrays of space-free strings.
#
# Bases (USER decision 2026-10-06, DESIGN_DISTROLESS.md): every final image is `scratch` or Google's distroless cc image pinned
# by digest (PINS DISTROLESS_CC); no distribution shell, coreutils, interpreter, compiler or package manager is in any image, no
# apt/dpkg/snapshot is on the build path, and no tool is a distribution package.
#
# EXTENSION PROCEDURE (new tool or new version):
#   1. add or edit the [[tool]] entry (url, sha256 of the ARCHIVE the url returns, linkage, provenance, role, classes, profiles,
#      files, smoke) and list it in the [[image]] that gets it (or add an [[image]] and a [[profile]]);
#   2. bash verify-tools.sh --manifest --profiles <p>      (static checks; exit 13 while a selected value is PLACEHOLDER);
#   3. rebuild: bash build.sh --profiles <p> --yes          (the manifest hash is part of every affected image's inputs hash);
#   4. re-verify: bash verify-tools.sh --images --smoke --deep --inspect --profiles <p>, then probe.sh for a check image.
#   The security-auditor verdict for the tool (WALL policy) is bound to the sha256 of its entry (tm_image_hash), so a changed
#   entry invalidates an earlier verdict.
#
# FIELDS
#   version      upstream version; {version} in url. PLACEHOLDER = not looked up yet (never invented).
#   tag          second version-like token some URLs need (python-build-standalone release tag, the Temurin build number), else absent.
#   url          https download of the archive (http, credentials and non-https redirects are refused), or file:<path in this
#                directory> for an in-repo script. apt:<package> (a distribution package) is refused (verify-tools.sh).
#   sha256       64 hex of the archive the url returns (prebuilt-upstream; built-from-source: of the source tarball); of the
#                file for in-repo (verify-tools.sh recomputes it).
#   file_sha256  64 hex of the INSTALLED file (the first of `files`) when it is not the archive itself: the busybox binary taken
#                out of its rootfs tarball, the bash binary built from source (required for built-from-source: the builder's
#                compiler floats, so the output is what is pinned). mkrootfs.sh refuses an installed file that differs; for
#                archive = binary and in-repo tools the installed file must hash to sha256 itself.
#   checksum_source  where the hash was checked against upstream (checksum file, signature, release API) or PLACEHOLDER.
#   linkage      static | dynamic. A dynamic tool's libraries must resolve from the image base (distroless cc: glibc, libstdc++,
#                libgcc_s, libgomp, libssl, libzstd, zlib) or from the tool's own /opt tree; nothing else is ever copied (no
#                third source of shared objects): the assemble stage fails naming the library. A tool of a scratch image must
#                be static. Where upstream does not say which, `notes` records that the linkage is unverified.
#   provenance   prebuilt-upstream | built-from-source (discarded builder stage, pinned and signature-checked source, recipe in
#                tc/, output pinned by file_sha256) | in-repo. distro-package is refused.
#   recipe, recipe_sha256   tc/<file>.sh and its pinned sha256 (verify-tools.sh recomputes it). built-from-source: the build recipe
#                (tc/build-bash.sh runs in the Alpine stage of Dockerfile.minimal); prebuilt-upstream installer trees (rust, ghc):
#                run by tc/fetch-tool.sh with SRC (extracted archive) and DEST (install prefix).
#   role         runtime (a check or a solver runs it) | probe (needed by probe/selftest scripts only) | selftest | server |
#                build-only (exists only in a discarded builder stage; never in a final image).
#   classes      item classes allowed to have it in their image: PF CP CR ES RS DS OE, EXT = extension languages no pool uses today.
#   profiles     profiles whose images may carry it.
#   dest, archive, strip, prune, bins, files, env, smoke   assembly: install dir in the image, archive kind (tar.gz tar.xz tar.bz2
#                tar.zst zip binary), tar --strip-components, paths removed after extraction (docs, man, headers, tests), PATH dirs
#                relative to dest, installed files hashed into the lock, ENV entries (K=V, no spaces), argv of the smoke test.
#   licence      SPDX id as published by upstream, or PLACEHOLDER (not verified; the candidate is then in `notes`).
#   notes        free text (no double quotes): what is unverified, newer upstream versions, the built-from-source alternative.
# [[image]] keys: dockerfile, target (the final stage; its check stage check-<target> is built first), kind, base (scratch |
#   distroless-cc: the final stage's FROM, a test compares them), profile, classes, tools.
# [[profile]] keys: images, explicit (yes: never part of `all`), deferred (a reason: the profile has no image and is refused
#   with exit 10, the skip code; `all` leaves it out).
#
# Values: the extension entries were read from upstream on 2026-10-05 by the researcher (TOOLCHAINS.md in eq-toolchains/); the
# core entries on 2026-10-06 (DESIGN_DISTROLESS.md section 4; busybox, jq and uv re-downloaded and recomputed by the implementing
# agent). Each entry's checksum_source says which upstream file the hash came from; the core entries agree with PINS (build.sh
# --check and verify-tools.sh compare them). The bash pins wait for the signature-checked first build: build.sh --resolve-tools.

# ===================================================================================================== core tools
[[tool]]
name = "lean"
version = "4.34.1"
url = "https://github.com/leanprover/lean4/releases/download/v{version}/lean-{version}-linux_aarch64.tar.zst"
sha256 = "fdb974c2cdb4627e090d5d4007b913e09d13c4868720fb5594e22808b3de9e37"
checksum_source = "GitHub release asset digest and a full local download, equal (PINS, 2026-10-04); upstream publishes no checksum file"
linkage = "dynamic"
provenance = "prebuilt-upstream"
role = "runtime"
classes = ["PF"]
profiles = ["core"]
licence = "Apache-2.0"
notes = "glibc only (no musl or static build upstream; the bundled glibc is for linking only): hence the distroless cc base. TOOLCHAINS.md: glibc floor 2.27 on aarch64; libc++, GMP, libuv and OpenSSL are linked statically, so only glibc is expected at run time (inference: the assemble stage checks it with ld.so --list against the base). Unpacked by minimal/untar.py (the builder has no zstd)"
dest = "/opt/lean"
archive = "tar.zst"
strip = "1"
files = ["/opt/lean/bin/lean"]
smoke = ["lean", "--version"]

