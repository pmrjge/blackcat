url = "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-{version}%2B{tag}/OpenJDK25U-jdk_aarch64_linux_hotspot_{version}_{tag}.tar.gz"
sha256 = "69df11a02cfa3ef7d7ca645e03edce6778ec090e100f6ae2b42097865730ac52"
checksum_source = "the .sha256.txt asset beside the tarball (Adoptium, read 2026-10-05); a GPG .sig exists"
linkage = "dynamic"
provenance = "prebuilt-upstream"
role = "runtime"
classes = ["EXT"]
profiles = ["jvm"]
licence = "PLACEHOLDER"
notes = "Eclipse Temurin 25.0.4.1+1 LTS (2026-08-21); the newest feature release is 27 (jdk-27+35), its sha256 was not read. Candidate licence GPL-2.0-only WITH Classpath-exception-2.0 (unverified). On the distroless cc base (zlib comes from it; whether Temurin links the system zlib is unverified). Prune: docs, jmods, src.zip and the AWT/X11 libraries a headless build never loads (they would fail the library check on libX11, freetype and similar); paths UNVERIFIED, the build names any unresolved library"
dest = "/opt/jdk"
archive = "tar.gz"
strip = "1"
prune = ["demo", "man", "include", "legal", "jmods", "lib/src.zip", "lib/libawt_xawt.so", "lib/libjawt.so", "lib/libsplashscreen.so", "lib/libfontmanager.so"]
bins = ["bin"]
files = ["/opt/jdk/bin/java", "/opt/jdk/bin/javac"]
env = ["JAVA_HOME=/opt/jdk"]
smoke = ["java", "-version"]

[[tool]]
name = "scala3"
version = "3.9.0"
url = "https://github.com/scala/scala3/releases/download/{version}/scala3-{version}.tar.gz"
sha256 = "8ecddee33ecda620256e4b744b928d3ad6de64653bd41e4b6a308992b3b6bb31"
checksum_source = "GitHub release asset digest of scala3-3.9.0.tar.gz (github.com/scala/scala3/releases/expanded_assets/3.9.0, read 2026-10-05; release 3.9.0 LTS, published 2026-09-03 per the releases API); the companion .sha256 asset was not read"
linkage = "dynamic"
provenance = "prebuilt-upstream"
role = "runtime"
classes = ["EXT"]
profiles = ["jvm"]
licence = "Apache-2.0"
notes = "USER decision 2026-10-05 (C5): the Scala 3 release tarball (the platform-independent JVM distribution, 169 MB) on the shared JDK, not scala-cli or sbt. The per-platform tarballs (scala3-3.9.0-aarch64-pc-linux.tar.gz) are not used. Licence from general knowledge (unverified here). The archive's top directory (strip 1) and the main class of the smoke test are UNVERIFIED until a build passes; the distribution scripts need a shell, so the smoke and the entry point call java -cp with the lib/* wildcard"
dest = "/opt/scala3"
archive = "tar.gz"
strip = "1"
bins = ["bin"]
files = ["/opt/scala3/bin/scalac"]
smoke = ["java", "-cp", "/opt/scala3/lib/*", "dotty.tools.MainGenericCompiler", "-version"]

# ===================================================================================================== images
# kind: check = the harness runs model-written code in it (needs /bin/sh + cp for the COPY_IN prefix: busybox and bash) |
# lang = an extension toolchain, no shell | server = a database. base: distroless-cc (PINS DISTROLESS_CC, by digest) or scratch.
[[image]]
name = "min-both"
dockerfile = "Dockerfile.minimal"
target = "eq-min"
kind = "check"
base = "distroless-cc"
profile = "core"
classes = ["PF"]
tools = ["lean", "uv", "python", "busybox", "bash", "perl-shim", "jq", "lake-shim"]

[[image]]
name = "min-py"
dockerfile = "Dockerfile.minimal"
target = "eq-py-min"
kind = "check"
base = "distroless-cc"
profile = "core"
classes = ["CP", "CR"]
tools = ["uv", "python", "busybox", "bash", "jq"]

[[image]]
name = "min-lean"
dockerfile = "Dockerfile.minimal"
target = "eq-lean-min"
kind = "check"
base = "distroless-cc"
profile = "core"
classes = ["PF"]
tools = ["lean", "busybox", "bash", "perl-shim", "lake-shim"]

[[image]]
name = "tc-node"
dockerfile = "Dockerfile.toolchains"
target = "eq-node"
kind = "lang"
base = "distroless-cc"
profile = "node"
classes = ["EXT"]
tools = ["node"]

[[image]]
name = "tc-go"
dockerfile = "Dockerfile.toolchains"
target = "eq-go"
kind = "lang"
base = "scratch"
profile = "go"
classes = ["EXT"]
tools = ["go"]

[[image]]
name = "tc-julia"
dockerfile = "Dockerfile.toolchains"
target = "eq-julia"
kind = "lang"
base = "distroless-cc"
profile = "julia"
classes = ["EXT"]
tools = ["julia"]

[[image]]
name = "tc-jvm"
dockerfile = "Dockerfile.toolchains"
target = "eq-jvm"
kind = "lang"
base = "distroless-cc"
profile = "jvm"
classes = ["EXT"]
tools = ["jdk", "scala3"]

# ===================================================================================================== profiles
# core is the installer default: the minimum the item classes PF, CP, CR need (ES, RS, DS, OE run no model-written code: their
# oracles run on the host, eq_harness.py:3265). explicit = "yes": never part of `all`, only when named (licence or measurement).
# deferred: the profile has no image (USER decision 5, 2026-10-06); naming it is refused with exit 10 (the skip code).
[[profile]]
name = "core"
images = ["min-both", "min-py"]
explicit = "no"

[[profile]]
name = "node"
images = ["tc-node"]
explicit = "no"

[[profile]]
name = "rust"
images = []
explicit = "no"
deferred = "needs a linker (rustc calls cc; no distroless image supplies one), see lib/eq-container/DESIGN_DISTROLESS.md section 3"

[[profile]]
name = "go"
images = ["tc-go"]
explicit = "no"

[[profile]]
name = "julia"
images = ["tc-julia"]
explicit = "no"

[[profile]]
name = "haskell"
images = []
explicit = "no"
deferred = "needs a linker (GHC calls cc and links libgmp; no distroless image supplies them), see lib/eq-container/DESIGN_DISTROLESS.md section 3"

[[profile]]
name = "jvm"
images = ["tc-jvm"]
explicit = "no"

[[profile]]
name = "candidates"
images = ["min-lean"]
explicit = "yes"
