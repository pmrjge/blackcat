linkage = "dynamic"
provenance = "prebuilt-upstream"
recipe = "tc/install-rust.sh"
recipe_sha256 = "6b9d7491f41bbcee50a2c35918b1e42309092d94b55bd11bc1645d489aa242f0"
role = "runtime"
classes = ["EXT"]
profiles = ["rust"]
licence = "MIT OR Apache-2.0"
notes = "DEFERRED (USER decision 5, 2026-10-06): rustc links through a cc driver and crt objects, which no distroless image supplies; the profile rust has no image and is refused (exit 10). The former Debian gcc closure is gone. Possible later without a distribution: the -musl host tarball (xz_hash 7559507ec98f044718ab6a786e26ecfd09764b5af29e0f0c075eb8e738c3214d) with its self-contained crt and rust-lld (UNVERIFIED). glibc 2.17 or newer. The standalone tarball is an installer tree, hence the recipe. Component names in the recipe UNVERIFIED"
dest = "/opt/rust"
archive = "tar.xz"
strip = "1"
prune = ["share/doc", "share/man", "lib/rustlib/uninstall.sh"]
bins = ["bin"]
files = ["/opt/rust/bin/rustc", "/opt/rust/bin/cargo"]
env = ["CARGO_HOME=/tmp/cargo", "CARGO_TARGET_DIR=/tmp/target"]
smoke = ["rustc", "--version"]

