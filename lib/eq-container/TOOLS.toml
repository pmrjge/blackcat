provenance = "prebuilt-upstream"
role = "runtime"
classes = ["EXT"]
profiles = ["jvm"]
licence = "PLACEHOLDER"
notes = "Eclipse Temurin 25.0.4.1+1 LTS (2026-08-21); the newest feature release is 27 (jdk-27+35), its sha256 was not read. Candidate licence GPL-2.0-only WITH Classpath-exception-2.0 (unverified). glibc floor and zlib linkage unverified. Prune: docs, jmods, src.zip and the AWT/X11 libraries a headless build never loads (they would make the ldd closure fail on libX11, freetype and similar); paths UNVERIFIED, the build names any unresolved library"
dest = "/opt/jdk"
archive = "tar.gz"
strip = "1"
prune = ["demo", "man", "include", "legal", "jmods", "lib/src.zip", "lib/libawt_xawt.so", "lib/libjawt.so", "lib/libsplashscreen.so", "lib/libfontmanager.so"]
bins = ["bin"]
files = ["/opt/jdk/bin/java", "/opt/jdk/bin/javac"]
env = ["JAVA_HOME=/opt/jdk"]
smoke = ["java", "-version"]

[[tool]]
name = "scala3"
version = "3.9.0"
url = "https://github.com/scala/scala3/releases/download/{version}/scala3-{version}.tar.gz"
sha256 = "8ecddee33ecda620256e4b744b928d3ad6de64653bd41e4b6a308992b3b6bb31"
checksum_source = "GitHub release asset digest of scala3-3.9.0.tar.gz (github.com/scala/scala3/releases/expanded_assets/3.9.0, read 2026-10-05; release 3.9.0 LTS, published 2026-09-03 per the releases API); the companion .sha256 asset was not read"
linkage = "dynamic"
provenance = "prebuilt-upstream"
role = "runtime"
classes = ["EXT"]
profiles = ["jvm"]
licence = "Apache-2.0"
notes = "USER decision 2026-10-05 (C5): the Scala 3 release tarball (the platform-independent JVM distribution, 169 MB) on the shared JDK, not scala-cli or sbt. The per-platform tarballs (scala3-3.9.0-aarch64-pc-linux.tar.gz) are not used. Licence from general knowledge (unverified here). The archive's top directory (strip 1) and the main class of the smoke test are UNVERIFIED until a build passes; the distribution scripts need a shell, so the smoke and the entry point call java -cp with the lib/* wildcard"
dest = "/opt/scala3"
archive = "tar.gz"
strip = "1"
bins = ["bin"]
files = ["/opt/scala3/bin/scalac"]
smoke = ["java", "-cp", "/opt/scala3/lib/*", "dotty.tools.MainGenericCompiler", "-version"]

