# ===================================================================================================== images
# kind: check = the harness runs model-written code in it (needs /bin/sh + cp for the COPY_IN prefix: busybox, see INSTALLER_SPEC.md
# section 12) | lang = an extension toolchain, no shell | server = a database. base: eq-base (shared glibc closure + /etc/passwd,group,
# FROM scratch, stage of Dockerfile.toolchains) or scratch (Dockerfile.minimal assembles its own rootfs).
[[image]]
name = "min-both"
dockerfile = "Dockerfile.minimal"
target = "eq-min"
kind = "check"
base = "scratch"
profile = "core"
classes = ["PF"]
tools = ["lean", "uv", "python", "busybox", "bash", "perl", "jq", "lake-shim"]

[[image]]
name = "min-py"
dockerfile = "Dockerfile.minimal"
target = "eq-py-min"
kind = "check"
base = "scratch"
profile = "core"
classes = ["CP", "CR"]
tools = ["uv", "python", "busybox", "bash", "jq"]

[[image]]
name = "min-lean"
dockerfile = "Dockerfile.minimal"
target = "eq-lean-min"
kind = "check"
base = "scratch"
profile = "core"
classes = ["PF"]
tools = ["lean", "busybox", "bash", "perl", "lake-shim"]

[[image]]
name = "tc-node"
dockerfile = "Dockerfile.toolchains"
target = "eq-node"
kind = "lang"
base = "eq-base"
profile = "node"
classes = ["EXT"]
tools = ["node"]

[[image]]
name = "tc-rust"
dockerfile = "Dockerfile.toolchains"
target = "eq-rust"
kind = "lang"
base = "eq-base"
profile = "rust"
classes = ["EXT"]
tools = ["rust", "cc"]

[[image]]
name = "tc-go"
dockerfile = "Dockerfile.toolchains"
target = "eq-go"
kind = "lang"
base = "eq-base"
profile = "go"
classes = ["EXT"]
tools = ["go"]

[[image]]
name = "tc-julia"
dockerfile = "Dockerfile.toolchains"
target = "eq-julia"
kind = "lang"
base = "eq-base"
profile = "julia"
classes = ["EXT"]
tools = ["julia"]

[[image]]
name = "tc-haskell"
dockerfile = "Dockerfile.toolchains"
target = "eq-haskell"
kind = "lang"
base = "eq-base"
profile = "haskell"
classes = ["EXT"]
tools = ["ghc", "cabal", "cc", "ghc-link-libs"]

[[image]]
name = "tc-jvm"
dockerfile = "Dockerfile.toolchains"
target = "eq-jvm"
kind = "lang"
base = "eq-base"
profile = "jvm"
classes = ["EXT"]
tools = ["jdk", "scala3"]

# ===================================================================================================== profiles
# core is the installer default: the minimum the item classes PF, CP, CR need (ES, RS, DS, OE run no model-written code: their
# oracles run on the host, eq_harness.py:3265). explicit = "yes": never part of `all`, only when named (licence or measurement).
[[profile]]
name = "core"
images = ["min-both", "min-py"]
explicit = "no"

[[profile]]
name = "node"
images = ["tc-node"]
explicit = "no"

[[profile]]
name = "rust"
images = ["tc-rust"]
explicit = "no"

[[profile]]
name = "go"
images = ["tc-go"]
explicit = "no"

[[profile]]
name = "julia"
images = ["tc-julia"]
explicit = "no"

[[profile]]
name = "haskell"
images = ["tc-haskell"]
explicit = "no"

[[profile]]
name = "jvm"
images = ["tc-jvm"]
explicit = "no"

[[profile]]
name = "candidates"
images = ["min-lean"]
explicit = "yes"
