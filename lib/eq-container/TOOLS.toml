linkage = "dynamic"
provenance = "prebuilt-upstream"
role = "runtime"
classes = ["PF"]
profiles = ["core"]
licence = "Apache-2.0"
notes = "TOOLCHAINS.md: glibc floor 2.27 on aarch64; libc++, GMP, libuv and OpenSSL are linked statically, so only glibc is expected at run time (inference: confirm with ldd, mkrootfs fails on an unresolved library)"
