# ============================================================================== extension toolchains (X3), all opt-in
# classes = EXT because no item pool needs these languages today. Every value is from TOOLCHAINS.md (2026-10-05); a value the
# researcher did not read is PLACEHOLDER, and the build stops (exit 13) naming it. rust, ghc and cabal stay pinned for later, but
# their profiles are DEFERRED (USER decision 5, 2026-10-06): rustc and GHC call a C linker, and no distroless image supplies one.

[[tool]]
name = "node"
version = "24.21.0"
url = "https://nodejs.org/dist/v{version}/node-v{version}-linux-arm64.tar.xz"
sha256 = "6ad1325edbdb5649c379b75a237147a666c95d4f9ae8d340fef2d1575d289ad2"
checksum_source = "nodejs.org/dist/v24.21.0/SHASUMS256.txt (read 2026-10-05); the GPG-signed variant was not verified"
linkage = "dynamic"
provenance = "prebuilt-upstream"
role = "runtime"
classes = ["EXT"]
profiles = ["node"]
licence = "MIT"
notes = "24.21.0 is the LTS (Krypton, 2026-09-08); Current is 26.10.0, sha256 7a6353f63eb3d04765004b4adf172616243e4522434635cb1d26288658b04ab5 (same SHASUMS256.txt family). glibc 2.28 or newer, no arm64 musl build upstream: on the distroless cc base (libstdc++ and libgcc_s come from it). SPDX id inferred from the LICENSE header. npm and corepack are pruned (X4: no package manager). Archive layout and prune paths UNVERIFIED until a build passes"
dest = "/opt/node"
archive = "tar.xz"
strip = "1"
prune = ["include", "share", "CHANGELOG.md", "README.md", "lib/node_modules", "bin/npm", "bin/npx", "bin/corepack"]
bins = ["bin"]
files = ["/opt/node/bin/node"]
smoke = ["node", "--version"]

[[tool]]
name = "rust"
version = "1.99.0"
url = "https://static.rust-lang.org/dist/2026-10-01/rust-{version}-aarch64-unknown-linux-gnu.tar.xz"
sha256 = "5a30ce742be0835d9b23fc862db5cbbbc71464e1c9b1fca22917e10e4ba32a92"
