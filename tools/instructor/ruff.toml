# ruff for the instructor scripts and tests: uvx ruff check tools/instructor
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# S603/S607: subprocess with a list argv and a PATH-resolved git/uv is the design (no shell anywhere)
ignore = ["S603", "S607"]

[lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

[lint.isort]
known-first-party = ["instr_common", "check_suite", "ff_merge", "worktree_audit", "instr_testlib"]
