# kubernetes-mcp-server 0.0.67 (containers/kubernetes-mcp-server), the magg catalog's "kubernetes"
# entry: read-only, core tools only, Secrets denied. The entry also passes --read-only and
# --toolsets core (flags override this file); denied_resources exists only here. Keys follow the
# README example. Uses your kubeconfig's current context.
