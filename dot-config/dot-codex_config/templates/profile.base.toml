# Static keys of the stack's Codex profile (codex.config.toml), read by lib/render_profile.py.
# The dynamic keys (model and effort, developer_instructions, the [agents.<role>] entries,
# [mcp_servers.*], [permissions.claude-agent-stack], [skills], [hooks]) come from the converters.
# Every key here must validate against the vendored config.schema.json
# (tests/test_profile_schema_contract.py). DESIGN.md §3 (first row), §4.1, §5, §7.6.

# L4: every escalation goes through PermissionRequest, where the guard can deny it.
# --no-escalation switches this to "never".
approval_policy = "on-request"

# L1: the beta permission profile [permissions.claude-agent-stack] (F15).
# --legacy-sandbox replaces this key with sandbox_mode = "workspace-write".
default_permissions = "claude-agent-stack"

# Hosted web search is not hookable (F12): web goes through the guarded MCP servers.
web_search = "disabled"

# output_shrink's partial port (DESIGN §5). DESIGN gives no value; this is the stack's own token
# cap on one tool output (dot-config/dot-claude/settings.json env MAX_MCP_OUTPUT_TOKENS = 25000).
tool_output_token_limit = 25000

[features]
# inline [hooks] of the profile run the guard (L3)
hooks = true
# V1 multi-agent with agents.max_depth; V2 ignores max_depth, so it stays off (F8, DESIGN §5)
multi_agent = true
multi_agent_v2 = false
# needed by [permissions.claude-agent-stack].network.domains (F15); dropped with --legacy-sandbox
network_proxy = true

[agents]
# CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH = 8 (L8 cannot spawn)
max_depth = 8
# CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS = 128; the guard's per-prompt spawn caps are tighter
max_concurrent_threads_per_session = 128
# covers only built-in roles, which the guard refuses anyway (DESIGN §2)
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"

# dot-config/dot-claude/settings.json sandbox.credentials.envVars (mode "deny"): never passed to the shell.
# The canonical keyed form (`filters`), not the legacy `exclude` list; the schema forbids both
# together. tests/test_render_profile.py pins this list to settings.json.
[shell_environment_policy.filters]
GITHUB_TOKEN = "exclude"
GH_TOKEN = "exclude"
GH_ENTERPRISE_TOKEN = "exclude"
GITHUB_ENTERPRISE_TOKEN = "exclude"
GITLAB_TOKEN = "exclude"
GITEA_TOKEN = "exclude"
FORGEJO_TOKEN = "exclude"
CODEBERG_TOKEN = "exclude"
HF_TOKEN = "exclude"
HUGGING_FACE_HUB_TOKEN = "exclude"
WANDB_API_KEY = "exclude"
JUPYTER_TOKEN = "exclude"
