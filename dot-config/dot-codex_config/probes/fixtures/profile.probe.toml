# Profile `probe`: logging hooks, two roles (underscore and hyphen), one MCP server.
[agents.probe_worker]
description = "Probe worker (underscore name)"
config_file = "@CODEX_HOME@/probe-roles/probe_worker.toml"

[agents.probe-worker]
description = "Probe worker (hyphenated name, U2)"
config_file = "@CODEX_HOME@/probe-roles/probe-worker.toml"

[mcp_servers.probe_echo]
command = "/usr/bin/env"
args = ["python3", "@ROOT@/bin/mcp_echo.py", "@ROOT@/logs/mcp.log"]

