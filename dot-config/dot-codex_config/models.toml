# Codex models for the claude-agent-stack port: the single source for tier -> model id, the effort
# scale, the effort sets Codex accepts per model and the opt-in Astra roles (DESIGN.md §2, §2.1;
# INTERFACES.md §3). Read by lib/convert_agents.py (load_models); changing a line here and re-running
# the installer is enough.

# The stack's model aliases (agent frontmatter `model:`) -> Codex model ids (decision Q1, 2026-10-06).
[tiers]
opus = "gpt-6.1-sol"
sonnet = "gpt-6-luna"

# The stack's effort scale, lowest first. Sol keeps the stack's level; Luna runs `luna_effort_offset`
# levels higher, capped at "max" (decision Q3). none, minimal and ultra are never emitted.
[effort]
luna_effort_offset = 1
levels = ["low", "medium", "high", "xhigh", "max"]

# What Codex accepts per model: `supported_reasoning_levels` of codex-rs/models-manager/models.json at
# rust-v0.160.1 (vendored extract: tests/fixtures/vendor/models.gpt6.json), with "ultra" removed (it adds
# Codex's own proactive subagents; the stack delegates itself). A contract test compares the two.
[accepted]
"gpt-6-astra" = ["low", "medium", "high", "xhigh", "max"]
"gpt-6.1-sol" = ["low", "medium", "high", "xhigh", "max"]
"gpt-6-sol" = ["low", "medium", "high", "xhigh", "max"]
"gpt-6-luna" = ["low", "medium", "high", "xhigh", "max"]

# Opt-in `codex-astra` profile: these roles move to the Astra model, effort from the `fable` column of
# dot-claude/hooks/agent_effort.json (DESIGN §2.1). Nothing uses Astra by default.
[astra]
model = "gpt-6-astra"
agents = ["ninja-coder", "main-coder", "mathematician", "planner", "proof-checker", "security-auditor"]

# "hyphen": role names as the agents' names (main-coder). "underscore": `-` -> `_` in role names, role
# file names and spawn text (main_coder), the fallback if probe P4 (U2) shows Codex refuses hyphens.
# Policy keys (stack/policy/agents.json) always stay the canonical hyphenated names.
[roles]
name_style = "hyphen"
