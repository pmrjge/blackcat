# ===================================================================================================== images
# kind: check = the harness runs model-written code in it (needs /bin/sh + cp for the COPY_IN prefix: busybox, see INSTALLER_SPEC.md
# section 12) | lang = an extension toolchain, no shell | server = a database. base: eq-base (shared glibc closure + /etc/passwd,group,
# FROM scratch, stage of Dockerfile.toolchains) or scratch (Dockerfile.minimal assembles its own rootfs). service: compose.yaml service.
[[image]]
name = "min-both"
dockerfile = "Dockerfile.minimal"
target = "eq-min"
kind = "check"
base = "scratch"
profile = "core"
classes = ["PF"]
service = "pf"
tools = ["lean", "uv", "python", "busybox", "bash", "perl", "jq", "lake-shim"]

[[image]]
name = "min-py"
dockerfile = "Dockerfile.minimal"
target = "eq-py-min"
kind = "check"
base = "scratch"
profile = "core"
classes = ["CP", "CR"]
service = "cp"
tools = ["uv", "python", "busybox", "bash", "jq"]

[[image]]
name = "min-lean"
dockerfile = "Dockerfile.minimal"
target = "eq-lean-min"
kind = "check"
base = "scratch"
profile = "core"
classes = ["PF"]
service = "pf"
tools = ["lean", "busybox", "bash", "perl", "lake-shim"]

[[image]]
name = "tc-node"
dockerfile = "Dockerfile.toolchains"
target = "eq-node"
kind = "lang"
base = "eq-base"
profile = "node"
classes = ["EXT"]
service = "node"
tools = ["node"]

[[image]]
name = "tc-rust"
dockerfile = "Dockerfile.toolchains"
target = "eq-rust"
kind = "lang"
base = "eq-base"
profile = "rust"
classes = ["EXT"]
service = "rust"
tools = ["rust"]

[[image]]
name = "tc-go"
dockerfile = "Dockerfile.toolchains"
target = "eq-go"
kind = "lang"
base = "eq-base"
profile = "go"
classes = ["EXT"]
service = "go"
tools = ["go"]

[[image]]
name = "tc-julia"
dockerfile = "Dockerfile.toolchains"
target = "eq-julia"
kind = "lang"
base = "eq-base"
profile = "julia"
classes = ["EXT"]
service = "julia"
tools = ["julia"]

[[image]]
name = "tc-haskell"
dockerfile = "Dockerfile.toolchains"
target = "eq-haskell"
kind = "lang"
base = "eq-base"
profile = "haskell"
classes = ["EXT"]
service = "haskell"
tools = ["ghc", "cabal"]

[[image]]
name = "tc-jvm"
dockerfile = "Dockerfile.toolchains"
target = "eq-jvm"
kind = "lang"
base = "eq-base"
profile = "jvm"
