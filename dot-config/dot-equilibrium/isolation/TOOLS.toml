# ===================================================================================================== profiles
# core is the installer default: the minimum the item classes PF, CP, CR need (ES, RS, DS, OE run no model-written code: their
# oracles run on the host, eq_harness.py:3265). explicit = "yes": never part of `all`, only when named (licence or measurement).
[[profile]]
name = "core"
images = ["min-both", "min-py"]
explicit = "no"

[[profile]]
name = "node"
images = ["tc-node"]
explicit = "no"

[[profile]]
name = "rust"
images = ["tc-rust"]
explicit = "no"

[[profile]]
name = "go"
images = ["tc-go"]
explicit = "no"

[[profile]]
name = "julia"
images = ["tc-julia"]
explicit = "no"

[[profile]]
